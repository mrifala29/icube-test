apiVersion: batch/v1
kind: Job
metadata:
  name: magento-installer
  namespace: magento
  labels:
    app: magento
    tier: installer
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: magento
        tier: installer
    spec:
      restartPolicy: OnFailure
      containers:
        - name: installer
          image: ghcr.io/alexcheng1982/docker-magento2:2.4.6-p3
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "=== [1/4] Checking Magento Installation Status ==="
              if [ -f /var/www/html/app/etc/env.php ] && grep -q "install_date" /var/www/html/app/etc/env.php 2>/dev/null; then
                echo "Magento env.php exists with install_date. Skipping database setup:install."
              else
                echo "Starting automated Magento 2 installation..."
                php /var/www/html/bin/magento setup:install \
                  --base-url="https://gadgetbekassidoarjo.my.id/" \
                  --db-host="$DB_HOST" \
                  --db-name="$DB_NAME" \
                  --db-user="$DB_USER" \
                  --db-password="$DB_PASSWORD" \
                  --admin-firstname="$ADMIN_FIRSTNAME" \
                  --admin-lastname="$ADMIN_LASTNAME" \
                  --admin-email="$ADMIN_EMAIL" \
                  --admin-user="$ADMIN_USER" \
                  --admin-password="$ADMIN_PASSWORD" \
                  --backend-frontname="$ADMIN_PATH" \
                  --search-engine="opensearch" \
                  --opensearch-host="$OPENSEARCH_HOST" \
                  --opensearch-port="$OPENSEARCH_PORT" \
                  --session-save="redis" \
                  --session-save-redis-host="$REDIS_HOST" \
                  --session-save-redis-port="$REDIS_PORT" \
                  --session-save-redis-db=0 \
                  --cache-backend="redis" \
                  --cache-backend-redis-server="$REDIS_HOST" \
                  --cache-backend-redis-port="$REDIS_PORT" \
                  --cache-backend-redis-db=1 \
                  --use-rewrites=1 \
                  --language="en_US" \
                  --currency="USD" \
                  --timezone="Asia/Jakarta"
                echo "Database installation completed successfully."
              fi

              echo "=== [2/4] Configuring Base URLs ==="
              php /var/www/html/bin/magento config:set web/unsecure/base_url "https://gadgetbekassidoarjo.my.id/" || true
              php /var/www/html/bin/magento config:set web/secure/base_url "https://gadgetbekassidoarjo.my.id/" || true
              php /var/www/html/bin/magento config:set web/url/redirect_to_base 0 || true
              php /var/www/html/bin/magento config:set web/secure/use_in_frontend 1 || true
              php /var/www/html/bin/magento config:set web/secure/use_in_adminhtml 1 || true

              echo "=== [3/4] Setting Deploy Mode ==="
              php /var/www/html/bin/magento deploy:mode:set developer --skip-compilation || true

              echo "=== [4/4] Flushing Magento Cache ==="
              php /var/www/html/bin/magento cache:flush || true
              echo "=== Magento Installation Job Completed Successfully ==="
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: magento-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: magento-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: DB_PASSWORD
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_PASSWORD
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_EMAIL
            - name: ADMIN_FIRSTNAME
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_FIRSTNAME
            - name: ADMIN_LASTNAME
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_LASTNAME
            - name: ADMIN_PATH
              valueFrom:
                configMapKeyRef:
                  name: magento-config
                  key: MAGENTO_ADMIN_PATH
            - name: OPENSEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: magento-config
                  key: OPENSEARCH_HOST
            - name: OPENSEARCH_PORT
              valueFrom:
                configMapKeyRef:
                  name: magento-config
                  key: OPENSEARCH_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: magento-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: magento-config
                  key: REDIS_PORT
          volumeMounts:
            - name: magento-media
              mountPath: /var/www/html/pub/media
      volumes:
        - name: magento-media
          persistentVolumeClaim:
            claimName: magento-media-pvc
