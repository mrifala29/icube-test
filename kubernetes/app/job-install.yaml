apiVersion: batch/v1
kind: Job
metadata:
  name: magento-installer
  namespace: magento
  labels:
    app: magento
    tier: installer
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: magento
        tier: installer
    spec:
      restartPolicy: OnFailure
      containers:
        - name: installer
          image: ghcr.io/alexcheng1982/docker-magento2:2.4.6-p3
          command:
            - /bin/bash
            - -c
            - |
              echo "=== [1/3] Checking Magento Installation Status ==="
              if [ -f /var/www/html/app/etc/env.php ] && grep -q "'install' =>" /var/www/html/app/etc/env.php 2>/dev/null; then
                echo "Magento env.php already exists and is configured. Skipping database setup:install."
              else
                echo "Starting automated Magento 2 database schema installation..."
                bin/magento setup:install \
                  --base-url="https://gadgetbekassidoarjo.my.id/" \
                  --db-host="mysql.magento.svc.cluster.local" \
                  --db-name="$DB_NAME" \
                  --db-user="$DB_USER" \
                  --db-password="$DB_PASSWORD" \
                  --admin-firstname="$ADMIN_FIRSTNAME" \
                  --admin-lastname="$ADMIN_LASTNAME" \
                  --admin-email="$ADMIN_EMAIL" \
                  --admin-user="$ADMIN_USER" \
                  --admin-password="$ADMIN_PASSWORD" \
                  --use-rewrites=1
                echo "Database installation completed successfully."
              fi
              
              echo "=== [2/3] Configuring Web Auto-Redirect Settings ==="
              bin/magento config:set web/url/redirect_to_base 0 || true
              bin/magento config:set web/secure/use_in_frontend 0 || true
              
              echo "=== [3/3] Flushing Magento Cache ==="
              bin/magento cache:flush || true
              echo "=== Magento Bootstrapping Job Completed Successfully ==="
          env:
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: magento-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: DB_PASSWORD
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_PASSWORD
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_EMAIL
            - name: ADMIN_FIRSTNAME
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_FIRSTNAME
            - name: ADMIN_LASTNAME
              valueFrom:
                secretKeyRef:
                  name: magento-secrets
                  key: MAGENTO_ADMIN_LASTNAME
          volumeMounts:
            - name: magento-media
              mountPath: /var/www/html/pub/media
      volumes:
        - name: magento-media
          persistentVolumeClaim:
            claimName: magento-media-pvc
